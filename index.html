<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Англия · 12–20 августа 2026</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f7f5ef;color:#17202a}.load{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;box-sizing:border-box}.load b{display:block;font-size:22px;margin-bottom:8px}.load span{color:#687078}</style></head><body><div class="load"><div><b>Англия · 12–20 августа</b><span>Загружаю путеводитель…</span></div></div><script>(async()=>{try{const files=['data/data_00a.txt','data/data_00b.txt','data/data_01.txt','data/data_02.txt','data/data_03a.txt','data/data_03b.txt','data/data_04.txt','data/data_05.txt','data/data_06.txt','data/data_07.txt','data/data_08.txt','data/data_09.txt','data/data_10a.txt','data/data_10b.txt','data/data_11a.txt','data/data_11b.txt','data/data_12.txt','data/data_13.txt'];const parts=await Promise.all(files.map((f,i)=>fetch(f).then(r=>{if(!r.ok)throw new Error(`Не загружен фрагмент ${i}: HTTP ${r.status}`);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div><b>Не удалось загрузить путеводитель</b><span>'+String(e)+'</span></div></div>'}})();</script></body></html>
