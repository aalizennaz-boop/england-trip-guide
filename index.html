<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Англия · 12–20 августа 2026</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f7f5ef;color:#17202a}
    .load{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;box-sizing:border-box}
    .load b{display:block;font-size:22px;margin-bottom:8px}.load span{color:#687078}
  </style>
</head>
<body>
  <div class="load"><div><b>Англия · 12–20 августа</b><span>Загружаю путеводитель…</span></div></div>
  <script>
  (async()=>{
    try{
      const V='20260813-0905';
      const files=['data/data_00a.txt','data/data_00b.txt','data/data_01.txt','data/data_02.txt','data/data_03a.txt','data/data_03b.txt','data/data_04.txt','data/data_05.txt','data/data_06.txt','data/data_07.txt','data/data_08.txt','data/data_09.txt','data/data_10a.txt','data/data_10b.txt','data/data_11a.txt','data/data_11b.txt','data/data_12.txt','data/data_13.txt'];
      const parts=await Promise.all(files.map((f,i)=>fetch(f+'?v='+V,{cache:'no-store'}).then(r=>{
        if(!r.ok) throw new Error(`Не загружен фрагмент ${i}: HTTP ${r.status}`);
        return r.text();
      })));
      const b64=parts.join('').replace(/\s/g,'');
      const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
      const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      const parser=new DOMParser();
      const doc=parser.parseFromString(html,'text/html');
      for(const src of ['assets/live-addon-20260813.js','assets/oxford-prison-addon-20260813.js','assets/runnymede-addon-20260813.js','assets/final-trip-addon-20260813.js','assets/lang-switch-20260813.js']){
        const s=doc.createElement('script'); s.src=src+'?v='+V; doc.body.appendChild(s);
      }
      document.open();
      document.write('<!doctype html>'+doc.documentElement.outerHTML);
      document.close();
    }catch(e){
      console.error(e);
      document.body.innerHTML='<div class="load"><div><b>Не удалось загрузить путеводитель</b><span>'+String(e)+'</span></div></div>';
    }
  })();
  </script>
</body>
</html>
