<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Англия · 12–20 августа 2026</title>
<style>body{margin:0;background:#f6f1e8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.load{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;box-sizing:border-box}.load b{display:block;font-size:22px;margin-bottom:8px}.load span{color:#667085}</style>
</head>
<body>
<div class="load" id="loading"><div><b>Загружаю путеводитель…</b><span>Англия · 12–20 августа</span></div></div>
<script>
(async()=>{
 try{
  const files=[
   'data/data_00.txt','data/data_01.txt','data/data_02.txt',
   'data/data_03a.txt','data/data_03b.txt',
   'data/data_04.txt','data/data_05.txt','data/data_06_07.txt','data/data_08_09.txt',
   'data/data_10.txt','data/data_11a.txt','data/data_11b.txt','data/data_12_13.txt'
  ];
  const parts=[];
  for(const f of files){
   const r=await fetch(f,{cache:'no-store'});
   if(!r.ok) throw new Error(f+' — HTTP '+r.status);
   parts.push((await r.text()).trim());
  }
  const b64=parts.join('');
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if(!('DecompressionStream' in window)) throw new Error('Браузер не поддерживает распаковку gzip');
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
  document.open(); document.write(html); document.close();
 }catch(e){
  document.body.innerHTML='<div class="load"><div><b>Не удалось загрузить путеводитель</b><span>'+String(e)+'</span></div></div>';
 }
})();
</script>
</body>
</html>
