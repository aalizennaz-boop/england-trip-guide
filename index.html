const windsor=doc.getElementById('windsor');if(windsor&&!doc.getElementById('windsor-hidden-live')){const extra=doc.createElement('div');extra.id='windsor-hidden-live';extra.className='live-extra searchable';extra.dataset.search='windsor legends hidden unusual herne hunter curfew tunnel crooked house shambles nell gwynne queen charlotte engine house last supper victoria assassination street food oven rex non vietnamese 1423 dim sum';extra.innerHTML=`<div class="live-kicker">Windsor, который легко пропустить</div><h2 class="live-title">Городские легенды, тайные детали и локальная еда</h2><p class="live-lead">Не отдельный экскурсионный день, а слой, который можно подмешивать к любой прогулке по центру. Почти всё ниже находится в 2–10 минутах пешком от Castle Hill; дальняя точка — Windsor Great Park.</p><div class="live-grid">
<article class="live-card searchable" data-search="crooked house shambles queen charlotte old kings head nell gwynne engine house church street"><div class="live-kicker">25–40 минут · бесплатно · 2–4 минуты от Castle</div><h3>Микромаршрут вокруг Guildhall: самый странный квартал Windsor</h3><p>За парадным фасадом замка Windsor внезапно становится почти средневековым. Здесь когда-то стояли мясные ряды и бойни — отсюда название <em>The Shambles</em>; неподалёку находился и старый квартал красных фонарей. Сейчас это несколько фотогеничных мощёных переулков, но история у них куда менее прилизанная.</p><ul><li><strong>Market Cross House / The Crooked House</strong> — перекошенный деревянный дом XVIII века, который до сих пор держится именно благодаря гибкому timber frame. Внутри сейчас The Shambles.</li><li><strong>Queen Charlotte Street</strong> — всего 51 ft 10 in, одна из самых коротких улиц Британии.</li><li><strong>The Old King’s Head</strong> — на фасаде ищите табличку о warrant на казнь Charles I.</li><li><strong>Burford House</strong> — по местной традиции именно здесь Charles II поселил Nell Gwynne.</li><li><strong>Engine House</strong> — узкий проход у Church Lane: здесь хранилась городская пожарная машина; над проходом сохранилась надпись 1803 года.</li></ul><div class="live-route"><strong>Как идти:</strong> Henry VIII Gate → Castle Hill вниз → Windsor Guildhall → Crooked House → Queen Charlotte Street → Church Street → Church Lane. Круг занимает меньше километра.</div><div class="live-actions"><a href="https://www.windsor.gov.uk/visitor-information/history-of-windsor" target="_blank" rel="noopener">История / маршрут</a><a href="https://www.google.com/maps/search/?api=1&query=Market+Cross+House+Windsor" target="_blank" rel="noopener">Карта</a></div></article>
<article class="live-card searchable" data-search="curfew tower sally port tunnel dungeon bells thames street"><div class="live-kicker">10–20 минут · бесплатно</div><h3>Curfew Tower: настоящий тоннель под High Street</h3><p>Это уже не легенда. Со стороны Thames Street в стене замка можно заметить маленькое зарешеченное окно — последнее оригинальное окно средневековой стены. Оно освещает <strong>sally port</strong>, подземный выход под High Street, задуманный как путь бегства во время осады. Тоннель, судя по историческим данным, так никогда и не понадобился.</p><p>Сам Curfew Tower ещё мрачнее: стены около 13 ft толщиной, в башне был dungeon, а тела казнённых изменников выставляли на battlements как предупреждение городу. В 09:00, 12:00 и 18:00 отсюда слышны колокола St George’s Chapel.</p><div class="live-route"><strong>Как дойти:</strong> от Castle Hill спускайтесь по Thames Street вдоль западной стены замка — около 5 минут. Смотреть нужно с улицы.</div><div class="live-actions"><a href="https://www.windsor.gov.uk/visitor-information/history-of-windsor" target="_blank" rel="noopener">Что искать</a><a href="https://www.google.com/maps/search/?api=1&query=Curfew+Tower+Windsor" target="_blank" rel="noopener">Карта</a></div></article>
<article class="live-card searchable" data-search="herne hunter ghost great park black stallion hounds legend"><div class="live-kicker">45–120 минут · бесплатно</div><h3>Herne the Hunter — главный призрак Windsor Great Park</h3><p>Если Windsor нужен настоящий местный миф, это он. Уже около тысячи лет здесь рассказывают о Herne the Hunter — всаднике с оленьими рогами, который появляется на чёрном коне во главе стаи чёрных гончих. По легенде, его появление предвещает беду, после чего процессия растворяется в Great Park.</p><p>Идти сюда интереснее не «ловить привидение», а знать эту историю во время прогулки по Long Walk: парк сразу перестаёт быть просто идеальной королевской перспективой.</p><div class="live-route"><strong>Как дойти:</strong> от Castle через Park Street к началу Long Walk — 5–10 минут. Дальше выбирайте 45–90 минут прогулки; до Copper Horse весь Long Walk тянется примерно 2.65 miles в одну сторону. Парк открыт до сумерек.</div><div class="live-actions"><a href="https://www.windsor.gov.uk/things-to-do/windsor-great-park-p236491/overview-t20081" target="_blank" rel="noopener">Легенда / парк</a><a href="https://www.google.com/maps/search/?api=1&query=The+Long+Walk+Windsor" target="_blank" rel="noopener">Карта</a></div></article>
<article class="live-card searchable" data-search="last supper st john baptist church de cleyn free"><div class="live-kicker">15–25 минут · бесплатно</div><h3>Last Supper в обычной приходской церкви</h3><p>St John the Baptist снаружи легко принять за ещё одну аккуратную городскую церковь. Внутри висит ранне‑XVII‑вековая <strong>Last Supper</strong> Francis de Cleyn, придворного художника James I. Картина пережила Гражданскую войну спрятанной вместе с серебром St George’s Chapel, позже была передана сюда George III и сегодня считается национальным сокровищем.</p><div class="live-route"><strong>Как дойти:</strong> 2 минуты от Guildhall по High Street. Хорошая остановка между Crooked House и Peascod Street.</div><div class="live-actions"><a href="https://www.windsorchurches.org.uk/windsor-parish-church-of-st-john-the-baptist/history-of-st-john-the-baptist/painting-of-the-last-supper/" target="_blank" rel="noopener">История картины</a><a href="https://www.google.com/maps/search/?api=1&query=St+John+the+Baptist+Windsor" target="_blank" rel="noopener">Карта</a></div></article>
<article class="live-card searchable" data-search="queen victoria assassination attempt station central 1882"><div class="live-kicker">10 минут · бесплатно</div><h3>Станция, где пытались застрелить Queen Victoria</h3><p>Windsor &amp; Eton Central выглядит сегодня как аккуратная викторианская торговая галерея, но в марте 1882 года именно при выходе со станции на Queen Victoria было совершено покушение. Это хороший маленький исторический стоп, особенно если всё равно проходите через Windsor Royal Shopping.</p><div class="live-route"><strong>Как дойти:</strong> 4–5 минут от Castle Hill; вход в Windsor Royal / Central Station.</div><div class="live-actions"><a href="https://www.windsor.gov.uk/visitor-information/history-of-windsor" target="_blank" rel="noopener">История Windsor</a><a href="https://www.google.com/maps/search/?api=1&query=Windsor+and+Eton+Central+Station" target="_blank" rel="noopener">Карта</a></div></article>
<article class="live-card searchable" data-search="guildhall museum charles camilla tour portraits"><div class="live-kicker">≈40 минут · от £5 при наличии тура</div><h3>Windsor Guildhall изнутри</h3><p>Снаружи его обычно используют просто как фон для фотографии. Внутри — civic rooms, королевские портреты и зал, где Charles III и Camilla заключили гражданский брак. Если в ваши даты есть tour, это короткий способ увидеть не дворцовую, а городскую власть Windsor.</p><div class="live-note">Туры проводятся на выбранные даты и требуют брони; если слота нет, сам квартал вокруг Guildhall всё равно обязателен.</div><div class="live-actions"><a href="https://tickets.windsor.gov.uk/sales/guildhalltour" target="_blank" rel="noopener">Проверить тур</a><a href="https://www.google.com/maps/search/?api=1&query=Windsor+Guildhall" target="_blank" rel="noopener">Карта</a></div></article>
</div><h3 class="live-subhead">Быстрая локальная еда вместо туристического меню</h3><p class="live-lead">Постоянного большого street-food market в центре Windsor на ваши даты нет, поэтому здесь лучше работает формат independent grab-and-go: маленькие кухни и пекарни, где можно взять что-то в руки и продолжить прогулку. И забавная историческая деталь: само название Peascod Street связано с pea-pods — масляные стручки гороха, вероятно, были местным уличным снеком ещё в XII веке.</p><div class="live-grid">
<article class="live-card searchable" data-search="the oven lebanese manakeesh wrap falafel halloumi peascod"><div class="live-kicker">5–7 минут от Castle · £</div><h3>The Oven — ливанская пекарня на Peascod Street</h3><p>Самый логичный вариант настоящего grab-and-go: свежая выпечка, Lebanese wraps, falafel, halloumi и арабский кофе. Это гораздо интереснее стандартного sandwich chain и хорошо ложится на прогулку по Peascod Street.</p><p><strong>Что брать:</strong> falafel wrap или halloumi wrap — около <span class="food-price">£7.99</span>; mint lemonade — около <span class="food-price">£5.99</span>.</p><div class="live-actions"><a href="https://www.google.com/maps/search/?api=1&query=The+Oven+55+Peascod+Street+Windsor" target="_blank" rel="noopener">Карта</a></div></article>
<article class="live-card searchable" data-search="1423 china kitchen dim sum xiao long bao ghost church lane chinese"><div class="live-kicker">2–3 минуты от Guildhall · ££</div><h3>1423 China Kitchen — dim sum в самом странном переулке</h3><p>Это не street-food stall, но для вашей программы место слишком удачное, чтобы пропускать: китайская кухня прямо в Church Lane, рядом со старым Engine House. Сам ресторан любит историю про hidden rooms, secret tunnels и friendly ghost — воспринимать это лучше как местный folklore, а не музейный факт.</p><p><strong>Что брать быстро:</strong> xiao long bao 4 шт. ≈ <span class="food-price">£8.95</span>, siu mai 4 шт. ≈ <span class="food-price">£8.95</span>, dim sum platter на одного ≈ <span class="food-price">£14.95</span>.</p><div class="live-actions"><a href="https://www.1423.co.uk/menu" target="_blank" rel="noopener">Меню</a><a href="https://www.google.com/maps/search/?api=1&query=1423+China+Kitchen+Windsor" target="_blank" rel="noopener">Карта</a></div></article>
<article class="live-card searchable" data-search="rex artisan bakery sourdough croissant cinnamon bun sausage roll peascod"><div class="live-kicker">5 минут от Castle · £</div><h3>Rex Artisan Bakery — британская пекарня без музейности</h3><p>Независимая Windsor bakery с настоящим sourdough и долгой ферментацией. Хороша именно как короткая остановка: купить выпечку и уйти к Long Walk или реке, а не садиться на часовой brunch.</p><p><strong>Ориентиры:</strong> Portuguese custard tart ≈ <span class="food-price">£2.85</span>, croissant ≈ <span class="food-price">£3.25</span>, cinnamon bun ≈ <span class="food-price">£3.70</span>, sausage roll ≈ <span class="food-price">£5.80</span>.</p><div class="live-actions"><a href="https://rexbakery.com/shop/" target="_blank" rel="noopener">Выпечка / цены</a><a href="https://www.google.com/maps/search/?api=1&query=Rex+Artisan+Bakery+Windsor" target="_blank" rel="noopener">Карта</a></div></article>
<article class="live-card searchable" data-search="non cafe vietnamese pho banh mi st leonards windsor"><div class="live-kicker">≈20 минут пешком от Castle · £</div><h3>Nón Cafe Kitchen — маленький Vietnamese detour</h3><p>Если хочется уйти от туристической оси Castle–High Street, идите на St Leonards Road. Nón — маленькое вьетнамское кафе с очень простым форматом и ценовой категорией £. Это вариант для pho, noodles и лёгкого азиатского обеда без резерва.</p><p><strong>Бюджет:</strong> ориентир около <span class="food-price">£10–15</span> на человека за основное блюдо.</p><div class="live-actions"><a href="https://www.google.com/maps/search/?api=1&query=Non+Cafe+Kitchen+Windsor" target="_blank" rel="noopener">Карта / идти пешком</a></div></article>
<article class="live-card searchable" data-search="shambles crooked house wine bar snacks"><div class="live-kicker">2 минуты от Castle · £10–20</div><h3>The Shambles — выпить внутри Crooked House</h3><p>Лучший способ не просто сфотографировать кривой дом, а зайти внутрь. Сейчас здесь маленький café/bar/bottle shop с light bites. Идеальный формат: пройти исторический квартал, взять бокал или кофе и десять минут посидеть внутри здания, которое выглядит так, будто его сейчас сложит пополам.</p><div class="live-actions"><a href="https://www.windsor.gov.uk/food-and-drink/the-shambles-p2350911" target="_blank" rel="noopener">О месте</a><a href="https://www.google.com/maps/search/?api=1&query=The+Shambles+Windsor" target="_blank" rel="noopener">Карта</a></div></article>
</div></div>`;const intro=windsor.querySelector('.city-intro');if(intro)intro.insertAdjacentElement('afterend',extra);else windsor.prepend(extra)}
if(windsor&&!doc.getElementById('bray-monkey-live')){const bray=doc.createElement('div');bray.id='bray-monkey-live';bray.className='live-extra searchable';bray.dataset.search='bray monkey island village bus 37 floating spa boat';bray.innerHTML=`<div class="live-kicker">Из Windsor напрямую · полдня</div><h2 class="live-title">Bray + Monkey Island: маршрут после выхода из автобуса</h2><p class="live-lead">Bray — не просто адрес Michelin-ресторанов. Это компактная деревня у Темзы, которую удобно пройти ногами от Village Hall до Monkey Island, не возвращаясь по своим следам.</p><div class="live-grid"><article class="live-card wide"><div class="live-kicker">№37 напрямую · ≈30–35 минут · прогулка 3–5 часов</div><h3>Как пройти Bray по шагам</h3><div class="live-route"><strong>Bray Village Hall → High Street → The Hind’s Head → The Fat Duck → St Michael’s Church → Jesus Hospital → Old Mill Lane → Thames → Monkey Island Estate.</strong></div><p>После High Street деревня быстро стихает: старые дома сменяются зеленью и рекой. На Monkey Island не нужно искать лодочный трансфер — <strong>на остров ведёт пешеходный мост с материка</strong>. Это частная территория отеля, поэтому для полноценного визита разумно иметь бронь ресторана, afternoon tea, spa или водной активности.</p><h4>Что смотреть на Monkey Island</h4><p>Два Grade I listed павильона были созданы как fishing retreat в XVIII веке. В Monkey Room сохранились знаменитые обезьяньи росписи, где животные пародируют человеческие занятия. На воде пришвартован Floating Spa; сам остров занимает около семи acres.</p><div class="live-note"><strong>Лодки:</strong> летом 2026 у Estate есть self-drive electric boat до 6 человек для некоторых package/stay bookings; частный charter из Bray начинается ориентировочно от £275–295 за первый час. Для самостоятельной аренды и spa обязательно проверяйте availability заранее.</div><div class="live-actions"><a href="https://www.monkeyislandestate.co.uk/" target="_blank" rel="noopener">Monkey Isl
