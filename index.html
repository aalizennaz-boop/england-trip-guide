<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Англия · 12–20 августа 2026</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f7f5ef;color:#17202a}.load{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;box-sizing:border-box}.load b{display:block;font-size:22px;margin-bottom:8px}.load span{color:#687078}</style></head><body><div class="load"><div><b>Англия · 12–20 августа</b><span>Загружаю путеводитель…</span></div></div><script>(async()=>{try{const n=14;const parts=await Promise.all(Array.from({length:n},(_,i)=>fetch(`data/data_${String(i).padStart(2,'0')}.txt`).then(r=>{if(!r.ok)throw new Error(`Не загружена часть ${i}: HTTP ${r.status}`);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div><b>Не удалось загрузить путеводитель</b><span>'+String(e)+'</span></div></div>'}})();</script></body></html>
