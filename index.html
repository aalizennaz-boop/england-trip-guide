<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Англия · 12–20 августа 2026</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f7f5ef;color:#17202a}.load{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center;box-sizing:border-box}.load b{display:block;font-size:22px;margin-bottom:8px}.load span{color:#687078}</style></head><body><div class="load"><div><b>Англия · 12–20 августа</b><span>Загружаю путеводитель…</span></div></div><script>(async()=>{try{const files=['data/data_00a.txt','data/data_00b.txt','data/data_01.txt','data/data_02.txt','data/data_03a.txt','data/data_03b.txt','data/data_04.txt','data/data_05.txt','data/data_06.txt','data/data_07.txt','data/data_08.txt','data/data_09.txt','data/data_10a.txt','data/data_10b.txt','data/data_11a.txt','data/data_11b.txt','data/data_12.txt','data/data_13.txt'];const parts=await Promise.all(files.map((f,i)=>fetch(f).then(r=>{if(!r.ok)throw new Error(`Не загружен фрагмент ${i}: HTTP ${r.status}`);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const parser=new DOMParser();const doc=parser.parseFromString(html,'text/html');if(!doc.getElementById('cookham-addon')){const style=doc.createElement('style');style.textContent=`#cookham-addon{margin:18px 0 24px;padding:0;background:transparent}#cookham-addon .ck-card{background:#fff;border:1px solid rgba(23,32,42,.12);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(23,32,42,.06)}#cookham-addon .ck-kicker{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#687078;margin-bottom:8px}#cookham-addon h3{margin:0 0 10px;font-size:22px;line-height:1.2;color:#17202a}#cookham-addon p{margin:0 0 12px;line-height:1.55}#cookham-addon .ck-route{background:#f7f5ef;border-radius:12px;padding:12px 14px;margin:14px 0;font-size:14px;line-height:1.5}#cookham-addon .ck-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}#cookham-addon .ck-actions a{display:inline-block;padding:10px 13px;border-radius:999px;text-decoration:none;font-weight:650;font-size:14px;border:1px solid rgba(23,32,42,.15);color:#17202a;background:#fff}#cookham-addon .ck-actions a:first-child{background:#17202a;color:#fff;border-color:#17202a}@media(max-width:640px){#cookham-addon .ck-card{padding:17px}#cookham-addon h3{font-size:20px}}`;doc.head.appendChild(style);const section=doc.createElement('section');section.id='cookham-addon';section.innerHTML=`<div class="ck-card"><div class="ck-kicker">35–50 мин из Windsor · деревня у Темзы</div><h3>Cookham — «Village in Heaven»</h3><p>Тихая английская деревня на Темзе, куда стоит ехать не за списком достопримечательностей, а за атмосферой: старая High Street, зелёные берега, пабы, садики и тот самый пейзаж, который художник Stanley Spencer превратил в собственную мифологию. Cookham был его домом и главным источником сюжетов — поэтому обычные деревенские улицы здесь неожиданно ощущаются как часть картины.</p><p><strong>Что делать:</strong> пройти High Street, заглянуть в Stanley Spencer Gallery, дойти до Темзы и оставить время на спокойный обед или напиток в пабе. Галерея летом 2026 открыта ежедневно 10:30–16:30; взрослый билет £9, до 18 лет — бесплатно.</p><div class="ck-route"><strong>Как добраться из Windsor:</strong><br>Windsor &amp; Eton Central → Slough → Maidenhead → Cookham. Последний участок — короткая ветка GWR из Maidenhead. В зависимости от стыковок закладывай примерно 35–50 минут.</div><div class="ck-actions"><a href="https://www.gwr.com/stations-and-destinations/stations/cookham" target="_blank" rel="noopener">Поезд / GWR</a><a href="https://stanleyspencer.org.uk/visit/" target="_blank" rel="noopener">Stanley Spencer Gallery</a><a href="https://www.google.com/maps/search/?api=1&query=Cookham%2C+Berkshire" target="_blank" rel="noopener">Открыть на карте</a></div></div>`;const headings=[...doc.querySelectorAll('h1,h2,h3,h4,h5')];const anchor=headings.find(el=>/куда\s+поехать\s+из\s+windsor/i.test((el.textContent||'').trim()))||headings.find(el=>/^windsor$/i.test((el.textContent||'').trim()));if(anchor){anchor.insertAdjacentElement('afterend',section)}else{(doc.querySelector('main')||doc.body).appendChild(section)}}html='<!doctype html>'+doc.documentElement.outerHTML;document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div><b>Не удалось загрузить путеводитель</b><span>'+String(e)+'</span></div></div>'}})();</script></body></html>
